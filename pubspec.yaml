name: tts_reader
description: 桃花源阅读器 —— 支持 PDF / EPUB / TXT 导入、系统与云端 TTS 朗读的 Material 3 应用
publish_to: 'none'
version: 1.22.12+174

environment:
  # Flutter 3.22+ （ColorScheme.surfaceContainer* 与 Records 语法）
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # 文件导入
  file_picker: ^8.0.6
  # 系统 TTS
  # 精确锁定 4.0.2：4.2.4+ 的 android minSdkVersion 提升到 24，会与 minSdk 21 冲突
  flutter_tts: 4.0.2
  # 文档解析
  syncfusion_flutter_pdf: ^26.2.4
  # PDF 按原版式渲染（单页翻页查看）
  syncfusion_flutter_pdfviewer: ^26.2.4
  epubx: ^4.0.0
  html: ^0.15.4
  # EPUB 兼容解析（直接读 container.xml / OPF）
  xml: ^6.5.0
  archive: ^3.6.1
  # EPUB 封面解码 / 缩放 / 编码（需与 epubx 依赖的 image 3.x 保持一致）
  image: ^3.3.0
  # 内置浏览器与下载
  flutter_inappwebview: ^6.0.0
  flutter_downloader: ^1.11.7
  permission_handler: ^11.3.1
  # 基础能力
  path_provider: ^2.1.4
  shared_preferences: ^2.2.3
  # 朗读诊断导出：走系统分享面板（诊断系统用，发布包里入口默认关闭）
  share_plus: ^10.1.4
  http: ^1.2.1
  just_audio: ^0.9.39
  provider: ^6.1.2
  # 后台朗读 + 通知栏控制（前台服务 / 媒体通知）
  audio_service: ^0.18.15
  audio_session: ^0.1.18
  # 锁在 1.2.x：1.3+ 依赖 package_info_plus 9.x，其自带 AGP 8.12/Kotlin 2.2 与本工程 AGP 8.3/Kotlin 1.9 冲突
  wakelock_plus: ">=1.2.8 <1.3.0"
  # TXT 编码探测：GBK / Big5 解码（dart:convert 只有 UTF-8 / Latin-1）。
  # 必须纯 Dart —— 解析跑在 isolate 里，用不了插件。
  enough_convert: ^1.6.0
  dynamic_color: 1.7.0
  pdfrx: ^1.0.101

dev_dependencies:
  flutter_test:
    sdk: flutter
  # 真机 / 模拟器验证（PDF / EPUB / 网页朗读）：flutter test integration_test/ -d <device>
  integration_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    # 设置页「应用图标」的样式预览（与 Android 端的 mipmap 同源）
    - assets/icons/
