plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader("UTF-8") { reader -> localProperties.load(reader) }
}

def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0"

android {
    namespace = "com.example.tts_reader"
    // flutter_plugin_android_lifecycle 需要 35；flutter_tts 4.0.2 针对 34 编译
    compileSdk = 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.tts_reader"
        // flutter_downloader(21) / flutter_inappwebview(21) / flutter_tts(21) 的最低要求
        minSdk = 21
        targetSdk = 34
        versionCode = flutterVersionCode.toInteger()
        versionName = flutterVersionName
    }

    buildTypes {
        release {
            // 正式发布请替换为自己的签名配置
            signingConfig = signingConfigs.debug

            // ★v1.22.66：release **只出 arm64-v8a**。
            //
            // 为什么：拆包实测 47.0MB 里 42.5MB 是原生库，且打了 4 个 ABI ——
            //   x86_64 13.54MB / arm64-v8a 13.49MB / armeabi-v7a 13.16MB / x86 2.39MB
            // 而目标设备的 abilist 首选就是 arm64-v8a（PGKM10、
            // TB335FC 都是），另外三个纯属白装，等于把 29MB 塞进每个安装包。
            //
            // ⚠️ 只限 release，**不要**放到 defaultConfig：
            //   否则 debug 也只剩 arm64，x86_64 模拟器就再也跑不起来，
            //   而设备验证一直依赖模拟器（见 HANDOFF §8 的前提）。
            //
            // 出包命令要配套：flutter build apk --release --target-platform android-arm64
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
    }
}

flutter {
    source = "../.."
}
